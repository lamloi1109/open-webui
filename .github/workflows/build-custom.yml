name: Build Custom OpenWebUI

# Chỉ chạy khi có code mới vào nhánh custom
on:
  push:
    branches: [ "${{ secrets.DOCKER_USERNAME }}-custom" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Đăng nhập vào Docker Hub (Cần cài đặt Secrets trong Settings của Repo)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Setup Docker Buildx (để build nhanh hơn và multi-platform)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build và Push Image
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile  # Hoặc Dockerfile.custom nếu bạn tạo riêng
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/open-webui:latest, ${{secrets.DOCKER_USERNAME}}/open-webui:${{ github.sha }}
          # Dùng cache để build nhanh hơn
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/open-webui:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/open-webui:buildcache,mode=max