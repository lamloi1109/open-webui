name: Build Custom OpenWebUI

# Chỉ chạy khi có code mới vào nhánh custom
on:
  push:
    branches: [ "lelong-custom" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile  # Hoặc Dockerfile.custom nếu bạn tạo riêng
          push: true
          tags: lamloi1109/open-webui:latest, lamloi1109/open-webui:${{ github.sha }}

          cache-from: type=registry,ref=lamloi1109/open-webui:buildcache
          cache-to: type=registry,ref=lamloi1109/open-webui:buildcache,mode=max